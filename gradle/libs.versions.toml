[versions]
#Hot-reload
firebaseAnalytics = "2.3.0"
hotReload = "1.0.0-beta05"
#InAppReview
inAppReview = "2.0.2"
#InAppUpdate
inAppUpdate = "2.1.0"
#WorkManager
multiplatformSettings = "1.3.0"
workRuntimeKtx = "2.10.3"
#Glance Widget
glanceAppwidget = "1.1.1"

#Datastore
datastore = "1.1.7"

#ksp
ksp = "2.2.0-2.0.2"

#Kotlin_serialzation
kotlinxSerializationJson = "1.9.0"
kotlinxDateTime = "0.7.1"
kotlin = "2.2.10"

# Android
agp = "8.12.1"

android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"
androidx-lifecycle = "2.9.2"
androidx-activity = "1.10.1"
composeMultiplatform = "1.8.2"
# Koin
koin-core = "4.1.0"
#Ktor
ktor = "3.2.3"
#Notofication
alarmee = "2.2.0"
#Coil-ImageLoader
coilCompose = "3.3.0"
#Room
sqlite = "2.5.2"
room = "2.8.0-rc01"
#Navigation
navigationCompose = "2.9.0-beta05"
backhandler = "1.8.0-alpha03"
mokoPermission = "0.20.0"

splashScreen = "1.2.0-rc01"
qrKit = "3.1.2"

[libraries]

#WorkManager
firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "firebaseAnalytics" }
firebase-crashlytics = { module = "dev.gitlive:firebase-crashlytics", version.ref = "firebaseAnalytics" }
firebase-database = { module = "dev.gitlive:firebase-database", version.ref = "firebaseAnalytics" }
firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "firebaseAnalytics" }
firebase-messaging = { module = "dev.gitlive:firebase-messaging", version.ref = "firebaseAnalytics" }
gitlive-firebase-analytics = { module = "dev.gitlive:firebase-analytics", version.ref = "firebaseAnalytics" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-no-arg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
work-manager = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }
#Glance Widget
glance-widget = { module = "androidx.glance:glance-appwidget", version.ref = "glanceAppwidget" }

#SplashScreen
splash = { module = "androidx.core:core-splashscreen", version.ref = "splashScreen" }

#Notofication
alarmee = { group = "io.github.tweener", name = "alarmee", version.ref = "alarmee" }
#Permission
moko-permission-notification = { module = "dev.icerock.moko:permissions-notifications", version.ref = "mokoPermission" }
moko-permission = { module = "dev.icerock.moko:permissions", version.ref = "mokoPermission" }
moko-permission-compose = { module = "dev.icerock.moko:permissions-compose", version.ref = "mokoPermission" }

#Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }


#Coil
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coilCompose" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coilCompose" }

#InAppUpdate
app-update = { group = "com.google.android.play", name = "app-update", version.ref = "inAppUpdate" }
app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "inAppUpdate" }
#InAppReview
review = { group = "com.google.android.play", name = "review", version.ref = "inAppReview" }
review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "inAppReview" }

#Datastore
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

#Navigation
compose-navigation = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

#Ktor
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin-core" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin-core" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin-core" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin-core" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin-core" }

#Kotlin_serialzation
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerializationJson" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDateTime" }

#Compose UI
backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "backhandler" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
qr-kit = { module = "network.chaintech:qr-kit", version.ref = "qrKit" }

[plugins]
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinParcelize = { id = "org.jetbrains.kotlin.plugin.parcelize" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "hotReload" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }